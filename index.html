<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Outlive 5D - Lush Living Wilderness</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #030806; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #gameContainer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #sensoryFilter {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 99; transition: background 0.3s ease, filter 0.3s ease;
    }

    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(6, 18, 14, 0.92); border: 1px solid #00ffaa;
      border-radius: 8px; padding: 8px 12px; color: #fff; font-size: 11px;
      backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0, 255, 170, 0.25);
    }
    .bar-bg { background: #12291d; height: 4px; border-radius: 2px; margin: 2px 0 5px 0; width: 130px; }
    .bar-fill { height: 100%; border-radius: 2px; transition: width 0.2s; }

    #topNav { position: fixed; top: 12px; right: 12px; z-index: 1000; display: flex; gap: 8px; }
    .nav-btn {
      background: rgba(8, 24, 18, 0.88); border: 1px solid #00ffaa;
      border-radius: 6px; color: #00ffaa; font-weight: 800; font-size: 11px;
      padding: 8px 12px; cursor: pointer; backdrop-filter: blur(4px);
    }
    .nav-btn:active { transform: scale(0.95); }

    #joystickBase {
      position: fixed; bottom: 28px; left: 28px; width: 114px; height: 114px;
      background: rgba(8, 22, 16, 0.78); border: 2px solid #00ffaa; border-radius: 50%;
      z-index: 1000; box-shadow: 0 0 18px rgba(0, 255, 170, 0.35);
      touch-action: none;
    }
    #joystickThumb {
      position: absolute; top: 50%; left: 50%; width: 44px; height: 44px;
      margin-top: -22px; margin-left: -22px; background: #00ffaa; border-radius: 50%;
      box-shadow: 0 0 12px #00ffaa; pointer-events: none; transform: translate(0px, 0px);
    }

    #actionPad {
      position: fixed; bottom: 25px; right: 20px; z-index: 1000;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    .action-row { display: flex; gap: 8px; }
    .act-btn {
      width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25);
      color: #fff; font-weight: 900; font-size: 10px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .act-btn:active { transform: scale(0.9); }
    #btnAttack { width: 60px; height: 60px; background: #d63031; border-color: #ff7675; font-size: 13px; }

    .game-modal {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 360px; max-width: 94vw; background: rgba(5, 16, 12, 0.96); border: 1px solid #00ffaa;
      border-radius: 12px; padding: 16px; color: #fff; z-index: 10005; box-shadow: 0 0 35px rgba(0, 255, 170, 0.3);
      backdrop-filter: blur(8px);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a3a2a; padding-bottom: 8px; margin-bottom: 10px; }
    .close-btn { background: none; border: none; color: #ff4757; font-size: 18px; font-weight: bold; cursor: pointer; }

    .craft-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .craft-tab-btn {
      flex: 1; padding: 6px 0; background: rgba(255,255,255,0.06); border: 1px solid #1a422e;
      color: #7ab896; font-size: 10px; font-weight: bold; border-radius: 6px; cursor: pointer;
    }
    .craft-tab-btn.active { background: #00ffaa; color: #000; border-color: #00ffaa; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="gameContainer"></div>
  <div id="sensoryFilter"></div>

  <div id="hud">
    <div style="color: #00ffaa; font-weight: 800; margin-bottom: 3px;">🌿 OUTLIVE 5D JUNGLE CORE</div>
    <div>HP: <span id="hpVal">100</span>% | <span id="bpmVal" style="color: #2ed573;">72 BPM</span></div>
    <div class="bar-bg"><div id="hpBar" class="bar-fill" style="background: #ff4757; width: 100%;"></div></div>
    <div>HUNGER: <span id="hunVal">100</span>% | THIRST: <span id="thiVal">100</span>%</div>
    <div class="bar-bg"><div id="hunBar" class="bar-fill" style="background: #f39c12; width: 100%;"></div></div>
    <div>STAMINA: <span id="nrgVal">100</span>% | SANITY: <span id="sanVal">100</span>%</div>
    <div class="bar-bg"><div id="nrgBar" class="bar-fill" style="background: #00d2d3; width: 100%;"></div></div>
    <div>WEATHER: <b id="weatherTxt" style="color: #00d2d3;">CLEAR</b> | <b id="cycleTxt" style="color: #ffd32a;">DAY</b></div>
  </div>

  <div id="topNav">
    <button class="nav-btn" id="btnOpenCraft">CRAFT (C)</button>
    <button class="nav-btn" id="btnOpenInv">BAG (I)</button>
  </div>

  <div id="joystickBase"><div id="joystickThumb"></div></div>

  <div id="actionPad">
    <div class="action-row">
      <button class="act-btn" id="btnShift" style="background: #6c5ce7;">5D</button>
      <button class="act-btn" id="btnWeather" style="background: #0984e3;">RAIN</button>
    </div>
    <div class="action-row">
      <button class="act-btn" id="btnDrink" style="background: #00cec9;">WATER</button>
      <button class="act-btn" id="btnHarvest" style="background: #2ed573;">GATHER</button>
      <button class="act-btn" id="btnAttack">ATK</button>
    </div>
  </div>

  <div class="game-modal" id="craftingModal">
    <div class="modal-head">
      <span style="font-weight: 800; color: #00ffaa;">SURVIVAL FABRICATOR</span>
      <button class="close-btn" id="btnCloseCraft">✕</button>
    </div>
    <div class="craft-tabs">
      <button class="craft-tab-btn active" id="tabSurvival" onclick="switchCraftTab('survival')">SURVIVAL</button>
      <button class="craft-tab-btn" id="tabWeapons" onclick="switchCraftTab('weapons')">WEAPONS</button>
      <button class="craft-tab-btn" id="tabShelter" onclick="switchCraftTab('shelter')">SHELTER</button>
      <button class="craft-tab-btn" id="tabTech" onclick="switchCraftTab('tech')">5D TECH</button>
    </div>
    <div id="craftRecipeList" style="display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto;"></div>
  </div>

  <div class="game-modal" id="inventoryModal">
    <div class="modal-head">
      <span style="font-weight: 800; color: #00ffaa;">BACKPACK STORAGE</span>
      <button class="close-btn" id="btnCloseInv">✕</button>
    </div>
    <div style="font-size: 11px; color: #848e9c; margin-bottom: 8px;">Load: <b id="invWeightText" style="color: #fff;">0.0</b> / 50.0 kg</div>
    <div id="invGrid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px;"></div>
    <div style="display: flex; gap: 8px;">
      <button id="btnEatFood" style="flex: 1; background: #f39c12; border: none; border-radius: 6px; padding: 8px; font-weight: bold; cursor: pointer; color: #000;">EAT</button>
      <button id="btnHealMed" style="flex: 1; background: #2ed573; border: none; border-radius: 6px; padding: 8px; font-weight: bold; cursor: pointer; color: #000;">HEAL</button>
    </div>
  </div>

  <script>
    // ========================================================
    // ১. টেরেইন উচ্চতা সমাধান ইঞ্জিন (Terrain Height Function)
    // ========================================================
    function getTerrainHeight(x, z) {
      const riverDist = Math.abs(x - 7 * Math.sin(z * 0.04));
      if (riverDist < 15) {
        return -2.8 + (riverDist / 15) * 1.6;
      } else {
        const hill = Math.sin(x * 0.03) * Math.cos(z * 0.03) * 8 + Math.sin(x * 0.075) * 2.5;
        return Math.max(0, hill);
      }
    }

    // ========================================================
    // ২. অডিও সিন্থেসাইজার
    // ========================================================
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
      },
      playHit(isZom = false) {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isZom ? "sawtooth" : "triangle";
        osc.frequency.setValueAtTime(isZom ? 85 : 200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
      },
      playShift(is5D) {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(is5D ? 180 : 550, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(is5D ? 550 : 180, this.ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.35);
      }
    };

    // ========================================================
    // ৩. মেটাবলিজম ও ভাইটালস
    // ========================================================
    const Survival = {
      hp: 100, hunger: 100, thirst: 100, stamina: 100, sanity: 100, bpm: 72,
      tick(dt, isMoving, isNight) {
        this.hunger = Math.max(0, this.hunger - dt * 0.35);
        this.thirst = Math.max(0, this.thirst - dt * 0.75);
        if (this.hunger === 0 || this.thirst === 0) this.hp = Math.max(0, this.hp - dt * 1.5);

        if (isMoving) {
          this.stamina = Math.max(0, this.stamina - dt * 6.0);
          this.bpm = Math.min(150, this.bpm + dt * 4);
        } else {
          this.stamina = Math.min(100, this.stamina + dt * 10);
          this.bpm = Math.max(68, this.bpm - dt * 2);
        }

        if (isNight) this.sanity = Math.max(0, this.sanity - dt * 0.5);
        else this.sanity = Math.min(100, this.sanity + dt * 0.8);

        document.getElementById("hpVal").innerText = Math.round(this.hp);
        document.getElementById("hpBar").style.width = `${Math.round(this.hp)}%`;
        document.getElementById("hunVal").innerText = Math.round(this.hunger);
        document.getElementById("hunBar").style.width = `${Math.round(this.hunger)}%`;
        document.getElementById("thiVal").innerText = Math.round(this.thirst);
        document.getElementById("nrgVal").innerText = Math.round(this.stamina);
        document.getElementById("nrgBar").style.width = `${Math.round(this.stamina)}%`;
        document.getElementById("sanVal").innerText = Math.round(this.sanity);
        document.getElementById("bpmVal").innerText = `${Math.round(this.bpm)} BPM`;
      }
    };

    // ========================================================
    // ৪. ইনভেন্টরি ও ক্রাফটিং ডাটাবেস
    // ========================================================
    window.InventoryState = {
      slots: { wood: 16, stone: 12, iron_ore: 4, fabric: 6, apples: 6, raw_meat: 3, bandage: 2, spear: 1, quantum_core: 1 },
      weights: { wood: 1.0, stone: 1.5, iron_ore: 2.0, fabric: 0.2, apples: 0.2, raw_meat: 0.8, bandage: 0.1, spear: 2.5, quantum_core: 2.0 }
    };

    window.MasterCraftingData = {
      survival: {
        campfire: { name: "Campfire", cost: { wood: 4, stone: 2 } },
        water_purifier: { name: "Water Purifier", cost: { wood: 3, iron_ore: 1 } },
        bandage: { name: "Med Bandage", cost: { fabric: 2 } }
      },
      weapons: {
        spear: { name: "Hunting Spear", cost: { wood: 4, stone: 2 } },
        iron_axe: { name: "Heavy Axe", cost: { wood: 3, iron_ore: 3 } },
        torch: { name: "Fire Torch", cost: { wood: 2, fabric: 1 } }
      },
      shelter: {
        tent: { name: "Tactical Tent", cost: { wood: 6, fabric: 4 } },
        barricade: { name: "Wood Barricade", cost: { wood: 8 } }
      },
      tech: {
        temporal_beacon: { name: "5D Anchor Beacon", cost: { stone: 6, quantum_core: 1 } }
      }
    };

    let activeCraftTab = "survival";
    function switchCraftTab(tab) {
      activeCraftTab = tab;
      document.querySelectorAll(".craft-tab-btn").forEach(b => {
        b.classList.toggle("active", b.id.toLowerCase().includes(tab));
      });
      renderCraftUI();
    }

    function renderCraftUI() {
      const list = document.getElementById("craftRecipeList");
      if (!list) return;
      list.innerHTML = "";

      const recipes = window.MasterCraftingData[activeCraftTab] || {};
      Object.keys(recipes).forEach(key => {
        const item = recipes[key];
        let canAfford = true;
        let costTxt = Object.keys(item.cost).map(m => {
          const has = window.InventoryState.slots[m] || 0;
          if (has < item.cost[m]) canAfford = false;
          return `${m}: ${has}/${item.cost[m]}`;
        }).join(" | ");

        const row = document.createElement("div");
        row.style.cssText = `background: rgba(14,35,24,0.9); border: 1px solid ${canAfford ? "#00ffaa" : "#244d36"}; border-radius: 8px; padding: 8px; display: flex; justify-content: space-between; align-items: center;`;
        row.innerHTML = `
          <div>
            <div style="font-weight: 700; font-size: 11px;">${item.name}</div>
            <div style="font-size: 9px; color: ${canAfford ? "#2ed573" : "#ff4757"}; font-weight: bold; margin-top: 2px;">${costTxt}</div>
          </div>
          <button style="background: ${canAfford ? "#00b894" : "#2d543e"}; border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 10px; padding: 6px 10px; cursor: ${canAfford ? "pointer" : "not-allowed"};" ${canAfford ? "" : "disabled"}>CRAFT</button>
        `;

        if (canAfford) {
          row.querySelector("button").onclick = () => {
            for (let m in item.cost) window.InventoryState.slots[m] -= item.cost[m];
            if (key === "tent" || key === "campfire" || key === "barricade" || key === "temporal_beacon") {
              deployStructure(key);
            } else {
              window.InventoryState.slots[key] = (window.InventoryState.slots[key] || 0) + 1;
            }
            renderCraftUI();
            renderInventoryGrid();
          };
        }
        list.appendChild(row);
      });
    }

    function renderInventoryGrid() {
      const grid = document.getElementById("invGrid");
      const weightText = document.getElementById("invWeightText");
      if (!grid) return;
      grid.innerHTML = "";

      let totalWeight = 0;
      Object.keys(window.InventoryState.slots).forEach(k => {
        const count = window.InventoryState.slots[k];
        const w = (window.InventoryState.weights[k] || 0.5) * count;
        totalWeight += w;

        const slot = document.createElement("div");
        slot.style.cssText = `background: rgba(255,255,255,0.06); border: 1px solid #1f4a33; border-radius: 6px; padding: 6px 0; text-align: center;`;
        slot.innerHTML = `<div style="font-size: 9px; font-weight: bold; color: #fff;">${k.replace('_', ' ').toUpperCase()}</div><div style="font-size: 11px; color: #00ffaa;">${count}</div>`;
        grid.appendChild(slot);
      });
      if (weightText) weightText.innerText = totalWeight.toFixed(1);
    }

    // ========================================================
    // ৫. ৩ডি সিন ও ওয়ার্ল্ড
    // ========================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1400);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.getElementById("gameContainer").appendChild(renderer.domElement);

    const skyFog = new THREE.FogExp2(0x0e2417, 0.0075);
    scene.fog = skyFog;

    const ambientLight = new THREE.AmbientLight(0xd4edda, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff4d6, 1.4);
    sunLight.castShadow = true;
    scene.add(sunLight);

    const moonLight = new THREE.DirectionalLight(0x3a6b5c, 0.35);
    scene.add(moonLight);

    const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffb142 }));
    const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(4.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xdff9fb }));
    scene.add(sunMesh); scene.add(moonMesh);

    // পাহাড়ি টেরেইন তৈরি
    const mapSize = 380;
    const terrainGeo = new THREE.PlaneGeometry(mapSize, mapSize, 80, 80);
    terrainGeo.rotateX(-Math.PI / 2);
    const posAttr = terrainGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const vx = posAttr.getX(i);
      const vz = posAttr.getZ(i);
      posAttr.setY(i, getTerrainHeight(vx, vz));
    }
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({ color: 0x194d25, roughness: 0.82, metalness: 0.08 });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // প্রবহমান নদী
    const river = new THREE.Mesh(
      new THREE.PlaneGeometry(30, mapSize, 10, 40),
      new THREE.MeshStandardMaterial({ color: 0x0abde3, roughness: 0.08, metalness: 0.8, transparent: true, opacity: 0.86 })
    );
    river.rotation.x = -Math.PI / 2;
    river.position.set(0, -0.6, 0);
    scene.add(river);

    const waterfall = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 14),
      new THREE.MeshBasicMaterial({ color: 0x48dbfb, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
    );
    waterfall.position.set(0, 3.5, -125);
    scene.add(waterfall);

    // ঘন বনানী ও গাছপালা
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2714, roughness: 0.9 });
    const foliageMat1 = new THREE.MeshStandardMaterial({ color: 0x1b7a34, roughness: 0.6 });
    const foliageMat2 = new THREE.MeshStandardMaterial({ color: 0x228b22, roughness: 0.6 });
    const foliageMat3 = new THREE.MeshStandardMaterial({ color: 0x2e8540, roughness: 0.65 });
    const bushMat = new THREE.MeshStandardMaterial({ color: 0x145a27, roughness: 0.7 });
    const mossRockMat = new THREE.MeshStandardMaterial({ color: 0x47594c, roughness: 0.85 });
    const flowerRedMat = new THREE.MeshStandardMaterial({ color: 0xff3838, roughness: 0.4 });
    const flowerYelMat = new THREE.MeshStandardMaterial({ color: 0xffc048, roughness: 0.4 });
    const appleMat = new THREE.MeshStandardMaterial({ color: 0xff3b30 });

    const treeTrunkGeo = new THREE.CylinderGeometry(0.35, 0.55, 3.8, 7);
    const pineGeo1 = new THREE.ConeGeometry(2.8, 4.5, 7);
    const pineGeo2 = new THREE.ConeGeometry(2.1, 3.8, 7);
    const bushGeo = new THREE.SphereGeometry(1.1, 8, 8);
    const rockGeo = new THREE.DodecahedronGeometry(1.2);
    const flowerGeo = new THREE.SphereGeometry(0.22, 6, 6);

    for (let i = 0; i < 135; i++) {
      const tx = (Math.random() - 0.5) * 320;
      const tz = (Math.random() - 0.5) * 320;
      if (Math.abs(tx) < 18) continue;

      const ty = getTerrainHeight(tx, tz);
      const treeGroup = new THREE.Group();
      const trunk = new THREE.Mesh(treeTrunkGeo, trunkMat);
      trunk.position.y = 1.9;
      trunk.castShadow = true;
      treeGroup.add(trunk);

      const fMat = (i % 3 === 0) ? foliageMat1 : ((i % 3 === 1) ? foliageMat2 : foliageMat3);
      const leavesLower = new THREE.Mesh(pineGeo1, fMat);
      leavesLower.position.y = 3.8;
      leavesLower.castShadow = true;
      treeGroup.add(leavesLower);

      const leavesUpper = new THREE.Mesh(pineGeo2, fMat);
      leavesUpper.position.y = 5.6;
      leavesUpper.castShadow = true;
      treeGroup.add(leavesUpper);

      if (i % 3 === 0) {
        for (let f = 0; f < 3; f++) {
          const apple = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), appleMat);
          apple.position.set((Math.random() - 0.5) * 1.8, 3.4 + Math.random() * 1.5, (Math.random() - 0.5) * 1.8);
          treeGroup.add(apple);
        }
      }

      treeGroup.position.set(tx, ty, tz);
      const scale = 0.8 + Math.random() * 0.5;
      treeGroup.scale.set(scale, scale, scale);
      scene.add(treeGroup);
    }

    // ঝোপঝাড় ও পাথর (মাটির উচ্চতা অনুযায়ী সাজানো)
    for (let i = 0; i < 95; i++) {
      const bx = (Math.random() - 0.5) * 310;
      const bz = (Math.random() - 0.5) * 310;
      if (Math.abs(bx) < 16) continue;
      const by = getTerrainHeight(bx, bz);
      const bush = new THREE.Mesh(bushGeo, bushMat);
      bush.position.set(bx, by + 0.6, bz);
      bush.scale.set(1.0 + Math.random() * 0.8, 0.7 + Math.random() * 0.5, 1.0 + Math.random() * 0.8);
      scene.add(bush);
    }

    for (let i = 0; i < 55; i++) {
      const rx = (Math.random() - 0.5) * 300;
      const rz = (Math.random() - 0.5) * 300;
      const ry = getTerrainHeight(rx, rz);
      const rock = new THREE.Mesh(rockGeo, mossRockMat);
      rock.position.set(rx, ry + 0.6, rz);
      rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
      const rs = 0.6 + Math.random() * 0.8;
      rock.scale.set(rs, rs * 0.7, rs);
      scene.add(rock);
    }

    for (let i = 0; i < 85; i++) {
      const fx = (Math.random() - 0.5) * 300;
      const fz = (Math.random() - 0.5) * 300;
      if (Math.abs(fx) < 16) continue;
      const fy = getTerrainHeight(fx, fz);
      const flMat = (i % 2 === 0) ? flowerRedMat : flowerYelMat;
      const fl = new THREE.Mesh(flowerGeo, flMat);
      fl.position.set(fx, fy + 0.3, fz);
      scene.add(fl);
    }

    // পরিত্যক্ত বাড়ি ও ভাঙা গাড়ি
    const house = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2d3a32, roughness: 0.9 });
    const w1 = new THREE.Mesh(new THREE.BoxGeometry(8, 4.5, 0.4), wallMat); w1.position.set(0, 2.25, -4);
    const w2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4.5, 8), wallMat); w2.position.set(-4, 2.25, 0);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(6.5, 2.8, 4), new THREE.MeshStandardMaterial({ color: 0x19271e }));
    roof.position.set(0, 5.5, 0); roof.rotation.y = Math.PI / 4;
    house.add(w1); house.add(w2); house.add(roof);
    house.position.set(40, getTerrainHeight(40, -50), -50);
    scene.add(house);

    const car = new THREE.Group();
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.2, 2.2), new THREE.MeshStandardMaterial({ color: 0x532a2a, roughness: 0.9 }));
    carBody.position.y = 0.8; car.add(carBody);
    car.position.set(-36, getTerrainHeight(-36, 32), 32); car.rotation.y = -0.5;
    scene.add(car);

    // ========================================================
    // ৬. অ্যানাটমিক্যাল হিউম্যানয়েড অবতার
    // ========================================================
    const player = new THREE.Group();
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5cd79, roughness: 0.5 });
    const vestMat = new THREE.MeshStandardMaterial({ color: 0x22362b, roughness: 0.6 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.7 });
    const bootMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), skinMat);
    head.position.y = 2.45;
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.12, 0.26), new THREE.MeshStandardMaterial({ color: 0x00ffaa, emissive: 0x008855 }));
    visor.position.set(0, 2.46, 0.25);
    player.add(head); player.add(visor);

    const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.36, 1.15, 10), vestMat);
    chest.position.y = 1.6;
    const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.85, 0.38), new THREE.MeshStandardMaterial({ color: 0x3d5647 }));
    backpack.position.set(0, 1.65, -0.4);
    player.add(chest); player.add(backpack);

    const armGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.9, 8);
    const leftArm = new THREE.Mesh(armGeo, skinMat); leftArm.position.set(-0.62, 1.5, 0);
    const rightArm = new THREE.Mesh(armGeo, skinMat); rightArm.position.set(0.62, 1.5, 0);
    player.add(leftArm); player.add(rightArm);

    const spearPole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.4, 6), new THREE.MeshStandardMaterial({ color: 0x4a3728 }));
    const spearTip = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 6), new THREE.MeshStandardMaterial({ color: 0xdcdde1, metalness: 0.9 }));
    spearTip.position.y = 1.2; spearPole.add(spearTip);
    spearPole.rotation.x = Math.PI / 2; spearPole.position.set(0, -0.4, 0.5);
    rightArm.add(spearPole);

    const legGeo = new THREE.CylinderGeometry(0.16, 0.13, 1.1, 8);
    const leftLeg = new THREE.Mesh(legGeo, pantsMat); leftLeg.position.set(-0.25, 0.6, 0);
    const rightLeg = new THREE.Mesh(legGeo, pantsMat); rightLeg.position.set(0.25, 0.6, 0);
    player.add(leftLeg); player.add(rightLeg);

    player.position.set(0, getTerrainHeight(0, 10), 10);
    scene.add(player);
    window.humanoidPlayer = player;
    const playerLimbs = { head, leftArm, rightArm, leftLeg, rightLeg, chest };

    // বন্যপ্রাণী ও জম্বি
    const deerList = [];
    const pigList = [];
    const zombieList = [];

    const deerMat = new THREE.MeshStandardMaterial({ color: 0xcd6133 });
    for (let i = 0; i < 5; i++) {
      const d = new THREE.Group();
      const b = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 0.8), deerMat); b.position.y = 1.2;
      const n = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, 0.35), deerMat); n.position.set(0.7, 1.8, 0); n.rotation.z = -0.3;
      d.add(b); d.add(n);
      const dx = 22 + i * 15;
      const dz = -25 - i * 10;
      d.position.set(dx, getTerrainHeight(dx, dz), dz);
      scene.add(d); deerList.push(d);
    }

    const boarMat = new THREE.MeshStandardMaterial({ color: 0x4834d4 });
    for (let i = 0; i < 4; i++) {
      const b = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 0.9), boarMat); body.position.y = 0.5;
      b.add(body);
      const bx = -30 - i * 12;
      const bz = -10 + i * 15;
      b.position.set(bx, getTerrainHeight(bx, bz), bz);
      scene.add(b); pigList.push(b);
    }

    const zombieMat = new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.7 });
    for (let i = 0; i < 6; i++) {
      const z = new THREE.Group();
      const zBody = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.3, 1.2, 8), zombieMat); zBody.position.y = 1.5;
      const zHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshStandardMaterial({ color: 0x1e824c })); zHead.position.y = 2.3;
      const zArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.9, 6), zombieMat); zArm.position.set(0.5, 1.6, 0.4); zArm.rotation.x = Math.PI / 2;
      z.add(zBody); z.add(zHead); z.add(zArm);
      const zx = (Math.random() - 0.5) * 180;
      const zz = -60 - Math.random() * 60;
      z.position.set(zx, getTerrainHeight(zx, zz), zz);
      scene.add(z); zombieList.push({ mesh: z, hp: 50 });
    }

    // ========================================================
    // ৭. স্ট্রাকচার ডিপ্লয়মেন্ট
    // ========================================================
    function deployStructure(type) {
      let struct;
      if (type === "tent") {
        struct = new THREE.Mesh(new THREE.ConeGeometry(2.4, 2.8, 4), new THREE.MeshStandardMaterial({ color: 0x16a085 }));
        struct.rotation.y = Math.PI / 4;
      } else if (type === "campfire") {
        struct = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.0, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0xd35400 }));
      } else if (type === "barricade") {
        struct = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.4, 0.5), new THREE.MeshStandardMaterial({ color: 0x795548 }));
      } else {
        struct = new THREE.Mesh(new THREE.OctahedronGeometry(1.2), new THREE.MeshStandardMaterial({ color: 0xbf55ec, wireframe: true }));
      }
      const sx = player.position.x + 2;
      const sz = player.position.z + 2;
      const sy = getTerrainHeight(sx, sz);
      struct.position.set(sx, sy + 1.0, sz);
      scene.add(struct);
      AudioEngine.playHit(false);
    }

    // ========================================================
    // ৮. ফুল টাচ স্ক্রিন ক্যামেরা ড্র্যাগ
    // ========================================================
    const cameraLook = {
      yaw: 0,
      pitch: 0.35,
      distance: 14.0,
      height: 6.0
    };

    let lookTouchId = null;
    let lastTouchX = 0;
    let lastTouchY = 0;

    window.addEventListener("touchstart", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const target = document.elementFromPoint(t.clientX, t.clientY);
        const isUI = target && (
          target.closest("#joystickBase") ||
          target.closest("#actionPad") ||
          target.closest("#topNav") ||
          target.closest(".game-modal") ||
          target.closest("#hud")
        );

        if (!isUI && lookTouchId === null) {
          lookTouchId = t.identifier;
          lastTouchX = t.clientX;
          lastTouchY = t.clientY;
          break;
        }
      }
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      if (lookTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === lookTouchId) {
          const deltaX = t.clientX - lastTouchX;
          const deltaY = t.clientY - lastTouchY;

          cameraLook.yaw -= deltaX * 0.0075;
          cameraLook.pitch += deltaY * 0.005;
          cameraLook.pitch = Math.max(0.08, Math.min(1.2, cameraLook.pitch));

          lastTouchX = t.clientX;
          lastTouchY = t.clientY;
          break;
        }
      }
    }, { passive: false });

    const endLook = (e) => {
      if (lookTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === lookTouchId) {
          lookTouchId = null;
          break;
        }
      }
    };
    window.addEventListener("touchend", endLook);
    window.addEventListener("touchcancel", endLook);

    let isMouseDown = false;
    window.addEventListener("mousedown", (e) => {
      if (!e.target.closest("#joystickBase") && !e.target.closest("#actionPad") && !e.target.closest("#hud") && !e.target.closest(".game-modal") && !e.target.closest("#topNav")) {
        isMouseDown = true;
        lastTouchX = e.clientX;
        lastTouchY = e.clientY;
      }
    });
    window.addEventListener("mousemove", (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - lastTouchX;
      const dy = e.clientY - lastTouchY;
      cameraLook.yaw -= dx * 0.006;
      cameraLook.pitch = Math.max(0.08, Math.min(1.2, cameraLook.pitch + dy * 0.004));
      lastTouchX = e.clientX;
      lastTouchY = e.clientY;
    });
    window.addEventListener("mouseup", () => { isMouseDown = false; });

    // ========================================================
    // ৯. টাচ জয়স্টিক কন্ট্রোল
    // ========================================================
    const joy = { x: 0, y: 0, active: false, walkTime: 0 };
    const base = document.getElementById("joystickBase");
    const thumb = document.getElementById("joystickThumb");

    let joyTouchId = null, joyCenter = { x: 0, y: 0 };
    const maxR = 38;

    base.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      joyTouchId = t.identifier;
      const rect = base.getBoundingClientRect();
      joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      if (joyTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === joyTouchId) {
          let dx = t.clientX - joyCenter.x;
          let dy = t.clientY - joyCenter.y;
          const dist = Math.hypot(dx, dy);
          if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
          thumb.style.transform = `translate(${dx}px, ${dy}px)`;
          joy.x = dx / maxR; joy.y = dy / maxR;
          joy.active = dist > 4;
          break;
        }
      }
    }, { passive: false });

    const resetJoy = (e) => {
      if (joyTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          joyTouchId = null;
          thumb.style.transform = `translate(0px, 0px)`;
          joy.x = 0; joy.y = 0; joy.active = false;
          break;
        }
      }
    };
    window.addEventListener("touchend", resetJoy);
    window.addEventListener("touchcancel", resetJoy);

    // বাটন অ্যাকশনস
    document.getElementById("btnAttack").onclick = () => {
      playerLimbs.rightArm.rotation.x = -Math.PI / 1.5;
      AudioEngine.playHit(false);
      setTimeout(() => { playerLimbs.rightArm.rotation.x = 0; }, 180);

      zombieList.forEach(z => {
        if (player.position.distanceTo(z.mesh.position) < 5.4) {
          z.hp -= 25;
          z.mesh.position.z -= 2;
          AudioEngine.playHit(true);
          if (z.hp <= 0) {
            z.mesh.position.y = -20;
            window.InventoryState.slots.raw_meat = (window.InventoryState.slots.raw_meat || 0) + 2;
            renderInventoryGrid();
          }
        }
      });
    };

    document.getElementById("btnHarvest").onclick = () => {
      window.InventoryState.slots.wood = (window.InventoryState.slots.wood || 0) + 3;
      window.InventoryState.slots.stone = (window.InventoryState.slots.stone || 0) + 2;
      window.InventoryState.slots.apples = (window.InventoryState.slots.apples || 0) + 1;
      AudioEngine.playHit(false);
      renderInventoryGrid();
    };

    document.getElementById("btnDrink").onclick = () => {
      if (Math.abs(player.position.x) < 22) {
        Survival.thirst = Math.min(100, Survival.thirst + 45);
        AudioEngine.playHit(false);
      }
    };

    document.getElementById("btnEatFood").onclick = () => {
      if (window.InventoryState.slots.apples > 0) {
        window.InventoryState.slots.apples--;
        Survival.hunger = Math.min(100, Survival.hunger + 25);
        renderInventoryGrid();
      }
    };

    document.getElementById("btnHealMed").onclick = () => {
      if (window.InventoryState.slots.bandage > 0) {
        window.InventoryState.slots.bandage--;
        Survival.hp = Math.min(100, Survival.hp + 35);
        renderInventoryGrid();
      }
    };

    let is5D = false;
    document.getElementById("btnShift").onclick = () => {
      is5D = !is5D;
      terrainMat.color.setHex(is5D ? 0x2c003e : 0x194d25);
      AudioEngine.playShift(is5D);
    };

    let isRaining = false;
    document.getElementById("btnWeather").onclick = () => {
      isRaining = !isRaining;
      document.getElementById("weatherTxt").innerText = isRaining ? "STORM RAIN" : "CLEAR";
      document.getElementById("weatherTxt").style.color = isRaining ? "#70a1ff" : "#00d2d3";
    };

    document.getElementById("btnOpenCraft").onclick = () => {
      document.getElementById("craftingModal").style.display = "block";
      document.getElementById("inventoryModal").style.display = "none";
      renderCraftUI();
    };
    document.getElementById("btnCloseCraft").onclick = () => document.getElementById("craftingModal").style.display = "none";
    document.getElementById("btnOpenInv").onclick = () => {
      document.getElementById("inventoryModal").style.display = "block";
      document.getElementById("craftingModal").style.display = "none";
      renderInventoryGrid();
    };
    document.getElementById("btnCloseInv").onclick = () => document.getElementById("inventoryModal").style.display = "none";

    // ========================================================
    // ১০. মাস্টার গেম লুপ (গ্রাউন্ড ক্ল্যাম্পিং সহ)
    // ========================================================
    const clock = new THREE.Clock();
    let dayCycle = 0;

    function gameLoop() {
      requestAnimationFrame(gameLoop);
      const dt = Math.min(clock.getDelta(), 0.1);

      dayCycle += dt * 0.035;
      const sunX = Math.cos(dayCycle) * 140;
      const sunY = Math.sin(dayCycle) * 140;
      sunLight.position.set(sunX, sunY, sunX * 0.5);
      sunMesh.position.set(sunX, sunY, sunX * 0.5);

      moonLight.position.set(-sunX, -sunY, -sunX * 0.5);
      moonMesh.position.set(-sunX, -sunY, -sunX * 0.5);

      const isNight = sunY < 0;
      document.getElementById("cycleTxt").innerText = isNight ? "NIGHT (COLD)" : "DAY";
      document.getElementById("cycleTxt").style.color = isNight ? "#3867d6" : "#ffd32a";
      ambientLight.intensity = isNight ? 0.2 : 0.6;

      Survival.tick(dt, joy.active, isNight);

      river.material.opacity = 0.82 + Math.sin(Date.now() * 0.003) * 0.04;
      waterfall.position.y = 3.5 + Math.sin(Date.now() * 0.008) * 0.15;

      // মুভমেন্ট ও লিম্ব অ্যানিমেশন
      if (joy.active) {
        const cosY = Math.cos(cameraLook.yaw);
        const sinY = Math.sin(cameraLook.yaw);

        const worldMoveX = (joy.x * cosY - joy.y * sinY);
        const worldMoveZ = (joy.x * sinY + joy.y * cosY);

        player.position.x += worldMoveX * 12 * dt;
        player.position.z += worldMoveZ * 12 * dt;

        player.rotation.y = Math.atan2(worldMoveX, worldMoveZ);

        joy.walkTime += dt * 13;
        const swing = Math.sin(joy.walkTime) * 0.65;
        playerLimbs.leftLeg.rotation.x = swing;
        playerLimbs.rightLeg.rotation.x = -swing;
        playerLimbs.leftArm.rotation.x = -swing;
        playerLimbs.rightArm.rotation.x = swing;
        playerLimbs.chest.position.y = 1.6 + Math.abs(Math.sin(joy.walkTime * 2)) * 0.06;
      } else {
        playerLimbs.leftLeg.rotation.x = 0;
        playerLimbs.rightLeg.rotation.x = 0;
        playerLimbs.leftArm.rotation.x = 0;
        playerLimbs.rightArm.rotation.x = 0;
        playerLimbs.chest.position.y = 1.6;
      }

      // গ্রাউন্ড ক্ল্যাম্পিং: প্লেয়ার কখনোই মাটির নিচে ঢুকবে না
      const targetGroundY = getTerrainHeight(player.position.x, player.position.z);
      player.position.y = THREE.MathUtils.lerp(player.position.y, targetGroundY, 0.25);

      // ক্যামেরা ফলো লজিক (মাটির উচ্চতা সমন্বিত)
      const camDistHoriz = cameraLook.distance * Math.cos(cameraLook.pitch);
      const camDistVert = cameraLook.distance * Math.sin(cameraLook.pitch) + cameraLook.height * 0.5;

      const targetCamX = player.position.x - Math.sin(cameraLook.yaw) * camDistHoriz;
      const targetCamZ = player.position.z - Math.cos(cameraLook.yaw) * camDistHoriz;
      const targetCamY = player.position.y + camDistVert;

      camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, 0.12);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetCamY, 0.12);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, 0.12);
      camera.lookAt(player.position.x, player.position.y + 1.8, player.position.z);

      // প্রাণী ও জম্বি উচ্চতা ক্ল্যাম্পিং
      deerList.forEach((d, i) => {
        d.position.x += Math.sin(Date.now() * 0.001 + i) * 0.03;
        d.position.y = getTerrainHeight(d.position.x, d.position.z);
      });
      pigList.forEach((p, i) => {
        p.position.z += Math.cos(Date.now() * 0.001 + i) * 0.025;
        p.position.y = getTerrainHeight(p.position.x, p.position.z);
      });

      zombieList.forEach(z => {
        if (z.hp > 0 && player.position.distanceTo(z.mesh.position) < 32) {
          z.mesh.lookAt(player.position.x, player.position.y, player.position.z);
          z.mesh.translateZ(3.2 * dt);
          z.mesh.position.y = getTerrainHeight(z.mesh.position.x, z.mesh.position.z);

          if (player.position.distanceTo(z.mesh.position) < 1.8) {
            Survival.hp = Math.max(0, Survival.hp - 10 * dt);
          }
        }
      });

      renderer.render(scene, camera);
    }
    gameLoop();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
