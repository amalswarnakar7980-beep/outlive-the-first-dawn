<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Outlive 5D - Live Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06090e; font-family: monospace; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(8, 12, 20, 0.9); border: 1px solid #00ffaa;
      border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 11px;
    }
    #controls {
      position: fixed; bottom: 16px; left: 16px; z-index: 1000;
      display: flex; gap: 8px;
    }
    button {
      padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold;
      color: #fff; cursor: pointer; font-size: 11px; background: #6c5ce7;
    }
  </style>
  <!-- Three.js লাইব্রেরি -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="hud">
    <div style="color: #00ffaa; font-weight: bold;">OUTLIVE 5D ENGINE: ONLINE</div>
    <div style="margin-top: 4px;">Status: Render Loop Active</div>
  </div>

  <div id="controls">
    <button onclick="alert('5D Engine Ready!')">TEST ENGINE</button>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (typeof THREE === "undefined") {
        document.body.innerHTML = "<h2 style='color:red;padding:20px;'>Three.js CDN লোড হতে পারেনি। ইন্টারনেট চেক করুন।</h2>";
        return;
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06090e);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 10, 15);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById("canvas-container").appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(10, 20, 10);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040));

      // গ্রাউন্ড গ্রিড
      const grid = new THREE.GridHelper(100, 50, 0x00ffaa, 0x1e272e);
      scene.add(grid);

      // প্লেয়ার কিউব
      const playerGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
      const playerMat = new THREE.MeshStandardMaterial({ color: 0x00ffaa });
      const cube = new THREE.Mesh(playerGeo, playerMat);
      cube.position.y = 0.75;
      scene.add(cube);

      camera.lookAt(cube.position);

      function animate() {
        requestAnimationFrame(animate);
        cube.rotation.y += 0.02;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    });
  </script>
</body>
</html>
