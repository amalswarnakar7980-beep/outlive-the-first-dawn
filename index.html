<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Outlive 5D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06090e; font-family: monospace; }
    #gameContainer { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    #sensoryFilter { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; }
    
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(8, 12, 20, 0.9); border: 1px solid #00ffaa;
      border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 11px;
    }
    .bar-bg { background: #1e293b; height: 5px; border-radius: 3px; margin: 4px 0 8px 0; width: 140px; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.2s; }
    
    #controls {
      position: fixed; bottom: 16px; left: 16px; z-index: 1000;
      display: flex; gap: 8px;
    }
    button {
      padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold;
      color: #fff; cursor: pointer; font-size: 11px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="gameContainer"></div>
  <div id="sensoryFilter"></div>

  <div id="hud">
    <div style="color: #00ffaa; font-weight: bold; margin-bottom: 4px;">5D SIMULATION CORE</div>
    <div>HP: <span id="hpVal">100</span>% | <span id="bpmVal" style="color: #2ed573;">72 BPM</span></div>
    <div class="bar-bg"><div id="hpBar" class="bar-fill" style="background: #ff4757; width: 100%;"></div></div>
    <div>STAMINA: <span id="nrgVal">100</span>%</div>
    <div class="bar-bg"><div id="nrgBar" class="bar-fill" style="background: #ffa502; width: 100%;"></div></div>
    <div>DIMENSION: <b id="dimVal" style="color: #00ffaa;">3D REALITY</b></div>
  </div>

  <div id="controls">
    <button id="btnShift" style="background: #6c5ce7;">🌀 5D SHIFT (V)</button>
    <button id="btnTime" style="background: #e17055;">⏳ TIME (T)</button>
    <button id="btnCamp" style="background: #00b894;">🔥 CRAFT (C)</button>
  </div>

  <!-- স্ক্রিপ্ট লোডিং সিকোয়েন্স -->
  <script src="audio.js"></script>
  <script src="connection_guard.js"></script>
  <script src="world.js"></script>
  <script src="player.js"></script>
  <script src="survival.js"></script>
  <script src="inventory.js"></script>
  <script src="crafting_engine.js"></script>
  <script src="entities.js"></script>
  <script src="main.js"></script>

</body>
</html>
