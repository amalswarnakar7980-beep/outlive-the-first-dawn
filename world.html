<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5D Hyperspace World Engine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06090e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #gameContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    /* ওয়ার্ল্ড স্ট্যাটাস কার্ড */
    #worldUI {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: rgba(10, 15, 26, 0.88);
      border: 1px solid #00ffaa;
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 11px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 20px rgba(0, 255, 170, 0.2);
    }
    #worldControls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      display: flex;
      gap: 10px;
    }
    .ctrl-btn {
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      font-size: 11px;
      transition: transform 0.1s ease;
    }
    .ctrl-btn:active {
      transform: scale(0.95);
    }
  </style>

  <!-- Three.js 3D লাইব্রেরি -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="gameContainer"></div>

  <!-- HUD ইনফো -->
  <div id="worldUI">
    <div style="color: #00ffaa; font-weight: 800; margin-bottom: 4px;">🌌 5D HYPERSPACE WORLD</div>
    <div>DIMENSION: <b id="dimTxt" style="color: #00ffaa;">3D REALITY</b></div>
    <div>TIME DILATION: <b id="warpTxt" style="color: #2ed573;">1.0x</b></div>
    <div>CYCLE: <b id="cycleTxt" style="color: #ffa502;">DAY</b></div>
  </div>

  <!-- ডাইমেনশন সুইচবোর্ড বাটন -->
  <div id="worldControls">
    <button class="ctrl-btn" id="btnDimShift" style="background: #6c5ce7;">🌀 5D SHIFT (V)</button>
    <button class="ctrl-btn" id="btnTimeWarp" style="background: #e17055;">⏳ WARP TIME (T)</button>
  </div>

  <script>
    // ==========================================================
    // 🌐 world.js থেকে রূপান্তরিত কোর ৫ডি ইঞ্জিন লজিক
    // ==========================================================
    let scene, camera, renderer, clock;
    let terrainMesh, helperGrid, directionalLight, ambientLight;

    const HyperCoords = {
      V: 0.0,
      targetV: 0.0,
      timeDilation: 1.0,
      dimensionName: "3D Reality"
    };

    let isNightTime = false;
    let dayNightCycle = 0;

    function initWorldEngine(containerId = "gameContainer") {
      const container = document.getElementById(containerId) || document.body;
      clock = new THREE.Clock();

      // ১. সিন এবং ফগ ইনিট
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06090e);
      scene.fog = new THREE.FogExp2(0x06090e, 0.015);

      // ২. পার্সপেক্টিভ ক্যামেরা
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 20, 35);
      camera.lookAt(0, 0, 0);

      // ৩. WebGL রেন্ডারার
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // ৪. আলো (অ্যাম্বিয়েন্ট ও সূর্য/চাঁদ)
      ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      directionalLight = new THREE.DirectionalLight(0x00ffaa, 1.2);
      directionalLight.position.set(30, 60, 30);
      directionalLight.castShadow = true;
      directionalLight.shadow.mapSize.width = 1024;
      directionalLight.shadow.mapSize.height = 1024;
      scene.add(directionalLight);

      // ৫. ৫ডি কোয়ান্টাম স্পেস গ্রিড টেরেইন
      const gridGeo = new THREE.PlaneGeometry(240, 240, 60, 60);
      gridGeo.rotateX(-Math.PI / 2);
      const gridMat = new THREE.MeshStandardMaterial({
        color: 0x111927,
        roughness: 0.8,
        metalness: 0.2,
        wireframe: false
      });
      terrainMesh = new THREE.Mesh(gridGeo, gridMat);
      terrainMesh.receiveShadow = true;
      scene.add(terrainMesh);

      // নিয়ন কোঅর্ডিনেট গাইড গ্রিড
      helperGrid = new THREE.GridHelper(240, 60, 0x00ffaa, 0x1f293d);
      helperGrid.position.y = 0.02;
      scene.add(helperGrid);

      // উইন্ডো রিসাইজ
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // বাটন ও কীবোর্ড ইনপুট বাইন্ডিং
      setupControls();

      // রেন্ডার লুপ চালু
      renderLoop();
    }

    // ৫ডি ডাইমেনশন ও টাইম কন্ট্রোল
    function setDimension5D(targetValue) {
      HyperCoords.targetV = targetValue;
      HyperCoords.dimensionName = targetValue > 0.5 ? "5D Ethereal" : "3D Reality";
      
      const dimTxt = document.getElementById("dimTxt");
      if (dimTxt) {
        dimTxt.innerText = targetValue > 0.5 ? "5D ETHEREAL VOID" : "3D REALITY";
        dimTxt.style.color = targetValue > 0.5 ? "#bf55ec" : "#00ffaa";
      }
    }

    function setTimeDilation(factor) {
      HyperCoords.timeDilation = factor;
      const warpTxt = document.getElementById("warpTxt");
      if (warpTxt) {
        warpTxt.innerText = `${factor}x`;
      }
    }

    function setupControls() {
      const shiftBtn = document.getElementById("btnDimShift");
      const timeBtn = document.getElementById("btnTimeWarp");

      const toggleShift = () => {
        const next = HyperCoords.targetV === 0.0 ? 1.0 : 0.0;
        setDimension5D(next);
      };

      const toggleTime = () => {
        const cur = HyperCoords.timeDilation;
        const next = cur === 1.0 ? 0.3 : (cur === 0.3 ? 2.5 : 1.0);
        setTimeDilation(next);
        timeBtn.innerText = next === 0.3 ? "⏳ SLOW-MO" : (next === 2.5 ? "⚡ FAST" : "⏳ WARP TIME (T)");
      };

      shiftBtn.onclick = toggleShift;
      timeBtn.onclick = toggleTime;

      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (k === "v") toggleShift();
        if (k === "t") toggleTime();
      });
    }

    // ৫ডি ম্যাথমেটিক্যাল স্পেস ট্রানজিশন ও ডে-নাইট সাইকেল
    function updateWorld5D(delta) {
      HyperCoords.V = THREE.MathUtils.lerp(HyperCoords.V, HyperCoords.targetV, 0.05);

      // দিন-রাত্রির পরিক্রমা
      dayNightCycle += delta * 0.03;
      const sunY = Math.sin(dayNightCycle);
      isNightTime = sunY < 0;

      const cycleTxt = document.getElementById("cycleTxt");
      if (cycleTxt) {
        cycleTxt.innerText = isNightTime ? "NIGHT (COLD)" : "DAY";
        cycleTxt.style.color = isNightTime ? "#3867d6" : "#ffa502";
      }

      if (directionalLight) {
        directionalLight.position.y = Math.max(sunY * 50, -10);
        directionalLight.intensity = isNightTime ? 0.2 : 1.2;
      }

      // কোয়ান্টাম ডাইমেনশন শিফট ট্রানজিশন (রং পরিবর্তন)
      if (scene && terrainMesh) {
        const r = THREE.MathUtils.lerp(isNightTime ? 0.02 : 0.08, 0.35, HyperCoords.V);
        const g = THREE.MathUtils.lerp(isNightTime ? 0.04 : 0.12, 0.05, HyperCoords.V);
        const b = THREE.MathUtils.lerp(isNightTime ? 0.08 : 0.18, 0.45, HyperCoords.V);
        
        scene.background.setRGB(r * 0.5, g * 0.5, b * 0.5);
        scene.fog.color.setRGB(r * 0.5, g * 0.5, b * 0.5);
        terrainMesh.material.color.setRGB(r, g, b);

        // ৫ডি ডাইমেনশনে গ্রিড রোটেশন
        helperGrid.rotation.y += delta * (0.02 + HyperCoords.V * 0.1);
      }
    }

    // রেন্ডার ফ্রেম লুপ
    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const delta = Math.min(clock.getDelta(), 0.1) * HyperCoords.timeDilation;
      updateWorld5D(delta);

      // ক্যামেরা স্লো অর্বিট প্যানিং (সিনের সৌন্দর্য দেখার জন্য)
      camera.position.x = Math.sin(Date.now() * 0.0003) * 20;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    // পেজ লোড হলে ইঞ্জিন স্টার্ট
    window.addEventListener("DOMContentLoaded", () => initWorldEngine("gameContainer"));
  </script>
</body>
</html>
